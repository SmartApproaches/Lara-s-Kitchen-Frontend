name: Deploy to Namecheap

on:
  push:
    branches:
      - main # Deploy to smartapproaches.online

jobs:
  deploy-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Check and show VITE_API_BASE_URL
        run: |
          if [ -z "${{ secrets.VITE_API_BASE_URL }}" ]; then
            echo "VITE_API_BASE_URL is not set!"
            exit 1
          else
            echo "VITE_API_BASE_URL is set to: ${{ secrets.VITE_API_BASE_URL }}"
          fi

      - name: Install dependencies and build the project
        run: |
          echo "Injecting VITE_API_BASE_URL into .env..."
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "Built .env contents:"
          cat .env

          echo "Cleaning node_modules and lock file..."
          rm -rf node_modules package-lock.json

          npm install
          npm run build

      - name: Deploy to FTP server (smartapproaches.online)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: 66.29.132.115
          username: ibkisaac@smartapproaches.online
          password: BAEtU8PY0HkV
          local-dir: dist/
